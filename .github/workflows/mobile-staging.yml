name: Mobile staging

on:
  push:
    branches: [staging/mobile]
    paths:
      - staging/source.json
      - scripts/staging/**
      - .github/workflows/mobile-staging.yml

permissions:
  contents: read

concurrency:
  group: homebase-mobile-staging
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/staging/mobile'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Check out staging release controls
        uses: actions/checkout@v7
        with:
          path: control
          persist-credentials: false
      - name: Validate pinned source
        id: source
        working-directory: control
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs'
          const s = JSON.parse(readFileSync('staging/source.json', 'utf8'))
          if (s.version !== 1 || s.repository !== process.env.GITHUB_REPOSITORY || !/^[a-f0-9]{40}$/.test(s.sourceSha)) throw new Error('Invalid pinned staging source')
          appendFileSync(process.env.GITHUB_OUTPUT, `sha=${s.sourceSha}\n`)
          JS
      - name: Check out exact application source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.sha }}
          path: app
          persist-credentials: false
      - name: Verify checkout identity
        working-directory: app
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Check types
        working-directory: app
        run: npm run typecheck
      - name: Lint source and tests
        working-directory: app
        run: npm run lint
      - name: Run tests
        working-directory: app
        run: npm test
      - name: Build production application for the staging path
        working-directory: app
        run: npm run build -- --base=/homebase/
      - name: Check formatting
        working-directory: app
        run: npm run format:check
      - name: Record build provenance and local asset hashes
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: node control/scripts/staging/package-preview.mjs app/dist control/staging/source.json
      - name: Upload verified static build
        uses: actions/upload-artifact@v7
        with:
          name: mobile-staging
          path: app/dist
          retention-days: 1
  deploy:
    if: github.ref == 'refs/heads/staging/mobile'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      deployments: read
      pages: write
    steps:
      - name: Check out trusted release controls
        uses: actions/checkout@v7
        with:
          path: control
          persist-credentials: false
      - name: Download verified static build
        uses: actions/download-artifact@v8
        with:
          name: mobile-staging
          path: artifact
      - name: Check out existing preview publisher
        uses: actions/checkout@v7
        with:
          ref: device-test-pages
          path: site
      - name: Append artifact release without rewriting history
        env:
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        run: node control/scripts/staging/publish-artifact.mjs artifact site
      - name: Request and verify the existing Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        run: node control/scripts/staging/await-pages.mjs site
  verify:
    if: github.ref == 'refs/heads/staging/mobile'
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out staging verification controls
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Install browser verification dependencies
        run: npm ci
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Verify the actual HTTPS preview in both mobile sizes
        env:
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        run: node scripts/staging/verify-preview.mjs https://lilant5431.github.io/homebase/ "$SOURCE_SHA"
